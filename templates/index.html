<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JumpingSpider</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #0a0a0a;
        --surface: #111111;
        --border: #222222;
        --muted: #444444;
        --subtle: #888888;
        --text: #e8e8e8;
        --accent: #00ff88;
        --error: #ff4444;
        --error-dim: #ff444418;
        --mono: "IBM Plex Mono", monospace;
        --sans: "Inter", sans-serif;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        border-bottom: 1px solid var(--border);
        padding: 20px 40px;
      }

      .logo {
        font-family: var(--mono);
        font-size: 18px;
        font-weight: 600;
        color: var(--accent);
      }

      .logo-sub {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--subtle);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-top: 2px;
      }

      .workspace {
        display: grid;
        grid-template-columns: 400px 1fr;
        flex: 1;
        height: calc(100vh - 65px);
      }

      .panel-left {
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }

      .panel-section {
        padding: 24px;
        border-bottom: 1px solid var(--border);
      }

      .section-label {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--subtle);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 14px;
      }

      .field {
        margin-bottom: 14px;
      }
      .field:last-child {
        margin-bottom: 0;
      }

      .field label {
        display: block;
        font-size: 12px;
        color: var(--subtle);
        margin-bottom: 6px;
      }

      input[type="text"] {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 9px 12px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text);
        outline: none;
        transition: border-color 0.15s;
      }

      input[type="text"]:focus {
        border-color: var(--accent);
      }
      input[type="text"]::placeholder {
        color: var(--muted);
      }

      .ai-main {
        padding: 24px;
        border-bottom: 1px solid var(--border);
      }

      .ai-hint {
        font-size: 12px;
        color: var(--subtle);
        margin-bottom: 14px;
      }

      .ai-input-row {
        display: flex;
        gap: 8px;
      }

      .ai-input-row input {
        flex: 1;
      }

      .btn-accent {
        background: var(--accent);
        color: #000;
        border: none;
        border-radius: 4px;
        padding: 9px 16px;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: opacity 0.15s;
      }

      .btn-accent:hover {
        opacity: 0.85;
      }
      .btn-accent:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .ai-status {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--subtle);
        margin-top: 10px;
        min-height: 16px;
      }

      .method-badge {
        font-family: var(--mono);
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 3px;
        margin-left: 8px;
        display: none;
      }

      .method-badge.ai {
        background: #00ff8822;
        color: var(--accent);
        border: 1px solid #00ff8844;
      }

      .method-badge.selectors {
        background: #a78bfa22;
        color: #a78bfa;
        border: 1px solid #a78bfa44;
      }

      .advanced-toggle {
        width: 100%;
        background: none;
        border: none;
        border-bottom: 1px solid var(--border);
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        color: var(--subtle);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition: color 0.15s;
      }

      .advanced-toggle:hover {
        color: var(--text);
      }

      .toggle-arrow {
        transition: transform 0.2s;
        font-size: 10px;
      }
      .toggle-arrow.open {
        transform: rotate(180deg);
      }

      .advanced-content {
        display: none;
        border-bottom: 1px solid var(--border);
      }
      .advanced-content.open {
        display: block;
      }
      .advanced-inner {
        padding: 20px 24px;
      }

      .advanced-note {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 16px;
        line-height: 1.5;
      }

      .selectors-header {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 6px;
        margin-bottom: 6px;
      }

      .selectors-header span {
        font-size: 11px;
        color: var(--muted);
        font-family: var(--mono);
        padding: 0 2px;
      }

      .selector-row {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 6px;
        margin-bottom: 6px;
        align-items: center;
      }

      .remove-btn {
        background: none;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--muted);
        cursor: pointer;
        padding: 8px 10px;
        font-size: 11px;
        transition: all 0.15s;
        line-height: 1;
      }

      .remove-btn:hover {
        border-color: var(--error);
        color: var(--error);
      }

      .add-field-btn {
        margin-top: 8px;
        background: none;
        border: 1px dashed var(--border);
        border-radius: 4px;
        color: var(--subtle);
        cursor: pointer;
        padding: 7px 12px;
        font-family: var(--mono);
        font-size: 11px;
        width: 100%;
        transition: all 0.15s;
      }

      .add-field-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .actions {
        padding: 20px 24px;
        margin-top: auto;
      }

      .btn-primary {
        background: var(--accent);
        color: #000;
        border: none;
        border-radius: 4px;
        padding: 12px;
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: opacity 0.15s;
      }

      .btn-primary:hover {
        opacity: 0.85;
      }
      .btn-primary:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .panel-right {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .results-header {
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .results-meta-wrap {
        display: flex;
        align-items: center;
      }
      .results-meta {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--subtle);
      }
      .results-meta span {
        color: var(--accent);
      }

      .save-buttons {
        display: none;
        gap: 8px;
      }
      .save-buttons.show {
        display: flex;
      }

      .btn-save {
        background: none;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--subtle);
        cursor: pointer;
        padding: 6px 14px;
        font-family: var(--mono);
        font-size: 11px;
        transition: all 0.15s;
        white-space: nowrap;
      }

      .btn-save:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .btn-save.ml {
        border-color: #444;
      }
      .btn-save.ml:hover {
        border-color: #a78bfa;
        color: #a78bfa;
      }

      .results-body {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
      }

      .empty-state {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: var(--muted);
      }

      .empty-state .icon {
        font-size: 32px;
        opacity: 0.4;
      }
      .empty-state p {
        font-family: var(--mono);
        font-size: 12px;
      }

      .loading-state {
        height: 100%;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }

      .loading-state.show {
        display: flex;
      }

      .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      .loading-state p {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--subtle);
      }

      .error-bar {
        background: var(--error-dim);
        border: 1px solid var(--error);
        border-radius: 4px;
        padding: 10px 14px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--error);
        margin-bottom: 16px;
        display: none;
      }

      .error-bar.show {
        display: block;
      }

      .result-grid {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .result-item {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
      }

      .result-item-header {
        padding: 8px 14px;
        border-bottom: 1px solid var(--border);
        font-family: var(--mono);
        font-size: 10px;
        color: var(--subtle);
        letter-spacing: 0.08em;
      }

      .result-item pre {
        padding: 12px 14px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text);
        overflow-x: auto;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .key-color {
        color: var(--subtle);
      }
      .val-color {
        color: var(--accent);
      }
      .null-color {
        color: var(--muted);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">JumpingSpider</div>
      <div class="logo-sub">web scraper</div>
    </header>

    <div class="workspace">
      <div class="panel-left">
        <div class="panel-section">
          <div class="section-label">Target</div>
          <div class="field">
            <label>URL</label>
            <input type="text" id="url" placeholder="https://example.com" />
          </div>
        </div>

        <div class="ai-main">
          <div class="section-label">What do you want to scrape?</div>
          <p class="ai-hint">
            Describe the fields in plain English — AI reads the whole page and
            extracts them.
          </p>
          <div class="ai-input-row">
            <input
              type="text"
              id="ai-fields"
              placeholder="e.g. title, price, author"
            />
            <button class="btn-accent" id="scrape-btn" onclick="scrapeData()">
              → go
            </button>
          </div>
          <div class="ai-status" id="ai-status"></div>
        </div>

        <button class="advanced-toggle" onclick="toggleAdvanced()">
          <span>Advanced — manual selectors</span>
          <span class="toggle-arrow" id="toggle-arrow">▼</span>
        </button>

        <div class="advanced-content" id="advanced-content">
          <div class="advanced-inner">
            <div class="field">
              <label>Container selector</label>
              <input
                type="text"
                id="container"
                placeholder="div.product, article.post"
              />
            </div>
            <div style="margin-top: 16px">
              <div class="selectors-header">
                <span>field name</span>
                <span>css selector</span>
                <span></span>
              </div>
              <div id="selectors">
                <div class="selector-row">
                  <input type="text" placeholder="name" class="selector-key" />
                  <input
                    type="text"
                    placeholder="selector"
                    class="selector-value"
                  />
                  <button class="remove-btn" onclick="removeSelector(this)">
                    ✕
                  </button>
                </div>
              </div>
              <button class="add-field-btn" onclick="addSelector()">
                + add field
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="panel-right">
        <div class="results-header">
          <div class="results-meta-wrap">
            <div class="results-meta" id="results-meta">waiting for input</div>
            <span class="method-badge" id="method-badge"></span>
          </div>
          <div class="save-buttons" id="save-buttons">
            <button
              class="btn-save"
              onclick="saveAsReport()"
              title="Clean HTML report — open in any browser"
            >
              ↓ save report
            </button>
            <button
              class="btn-save ml"
              onclick="saveAsJSONL()"
              title="JSONL format — ready for ML training pipelines"
            >
              ↓ save for ml
            </button>
          </div>
        </div>

        <div class="results-body">
          <div class="error-bar" id="error-bar"></div>

          <div class="empty-state" id="empty-state">
            <div class="icon">🕷</div>
            <p>results will appear here</p>
          </div>

          <div class="loading-state" id="loading-state">
            <div class="spinner"></div>
            <p id="loading-msg">fetching page...</p>
          </div>

          <div class="result-grid" id="result-grid" style="display: none"></div>
        </div>
      </div>
    </div>

    <script>
      let scrapedData = null;

      // ── XSS protection ──
      function escapeHTML(str) {
        if (str === null || str === undefined) return null;
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function toggleAdvanced() {
        const content = document.getElementById("advanced-content");
        const arrow = document.getElementById("toggle-arrow");
        content.classList.toggle("open");
        arrow.classList.toggle("open");
      }

      function addSelector() {
        const container = document.getElementById("selectors");
        const row = document.createElement("div");
        row.className = "selector-row";
        row.innerHTML = `
          <input type="text" placeholder="name" class="selector-key">
          <input type="text" placeholder="selector" class="selector-value">
          <button class="remove-btn" onclick="removeSelector(this)">✕</button>
        `;
        container.appendChild(row);
      }

      function removeSelector(btn) {
        btn.closest(".selector-row").remove();
      }

      function showError(msg) {
        const bar = document.getElementById("error-bar");
        bar.textContent = "✕ " + msg;
        bar.classList.add("show");
      }

      function clearError() {
        document.getElementById("error-bar").classList.remove("show");
      }

      function setLoading(on, msg) {
        document.getElementById("loading-state").style.display = on
          ? "flex"
          : "none";
        document.getElementById("empty-state").style.display = on
          ? "none"
          : "flex";
        document.getElementById("result-grid").style.display = "none";
        if (msg) document.getElementById("loading-msg").textContent = msg;
      }

      function renderResults(data) {
        const grid = document.getElementById("result-grid");
        grid.innerHTML = "";

        data.data.forEach((item, i) => {
          const div = document.createElement("div");
          div.className = "result-item";

          const lines = Object.entries(item)
            .map(([k, v]) => {
              const val =
                v === null
                  ? `<span class="null-color">null</span>`
                  : `<span class="val-color">"${escapeHTML(v)}"</span>`;
              return `  <span class="key-color">"${escapeHTML(k)}"</span>: ${val}`;
            })
            .join("\n");

          div.innerHTML = `
            <div class="result-item-header">ITEM ${String(i + 1).padStart(2, "0")}</div>
            <pre>${lines}</pre>
          `;
          grid.appendChild(div);
        });

        document.getElementById("empty-state").style.display = "none";
        document.getElementById("loading-state").style.display = "none";
        grid.style.display = "flex";
        document.getElementById("results-meta").innerHTML =
          `<span>${data.count}</span> items scraped from ${escapeHTML(data.url)}`;
        document.getElementById("save-buttons").classList.add("show");

        // Show which method was used
        const badge = document.getElementById("method-badge");
        if (data.method) {
          badge.textContent =
            data.method === "ai" ? "ai extraction" : "css selectors";
          badge.className = `method-badge ${data.method}`;
          badge.style.display = "inline";
        }
      }

      async function scrapeData() {
        const url = document.getElementById("url").value.trim();
        const fieldsInput = document.getElementById("ai-fields").value.trim();
        const container = document.getElementById("container").value.trim();

        const rows = document.querySelectorAll(".selector-row");
        const selectors = {};
        rows.forEach((row) => {
          const k = row.querySelector(".selector-key").value.trim();
          const v = row.querySelector(".selector-value").value.trim();
          if (k && v) selectors[k] = v;
        });

        // Parse fields from AI input
        const fields = fieldsInput
          ? fieldsInput
              .split(",")
              .map((f) => f.trim())
              .filter(Boolean)
          : [];

        clearError();

        if (!url) {
          showError("Enter a URL");
          return;
        }

        if (!fields.length && (!container || !Object.keys(selectors).length)) {
          showError(
            "Describe what you want to scrape, or open Advanced and add manual selectors",
          );
          return;
        }

        document.getElementById("scrape-btn").disabled = true;
        document.getElementById("save-buttons").classList.remove("show");
        document.getElementById("method-badge").style.display = "none";
        setLoading(true, "reading page...");
        document.getElementById("results-meta").textContent = "scraping...";

        try {
          const res = await fetch("/scrape", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url, fields, container, selectors }),
          });

          const data = await res.json();

          if (data.success) {
            scrapedData = data;
            renderResults(data);
          } else {
            showError(data.error);
            setLoading(false);
            document.getElementById("empty-state").style.display = "flex";
            document.getElementById("results-meta").textContent = "error";
          }
        } catch (err) {
          showError("Request failed: " + err.message);
          setLoading(false);
          document.getElementById("empty-state").style.display = "flex";
        } finally {
          document.getElementById("scrape-btn").disabled = false;
        }
      }

      // ── Save as HTML report ──
      function saveAsReport() {
        if (!scrapedData) return;

        const fields = Object.keys(scrapedData.data[0] || {});
        const timestamp = new Date().toLocaleString();

        const tableHeaders = fields
          .map((f) => `<th>${escapeHTML(f)}</th>`)
          .join("");

        const tableRows = scrapedData.data
          .map((item, i) => {
            const cells = fields
              .map(
                (f) =>
                  `<td>${item[f] !== null ? escapeHTML(String(item[f])) : '<span class="null">—</span>'}</td>`,
              )
              .join("");
            return `<tr><td class="num">${i + 1}</td>${cells}</tr>`;
          })
          .join("");

        const html = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scrape Report</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f9f9f9; color: #111; padding: 40px; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    .meta { color: #888; font-size: 13px; margin-bottom: 30px; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    th { background: #111; color: white; padding: 12px 16px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    td { padding: 11px 16px; border-bottom: 1px solid #f0f0f0; font-size: 13px; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }
    .num { color: #aaa; font-size: 12px; width: 40px; }
    .null { color: #ccc; }
    .footer { margin-top: 20px; font-size: 12px; color: #aaa; }
  </style>
</head>
<body>
  <h1>Scrape Report</h1>
  <div class="meta">Source: <a href="${escapeHTML(scrapedData.url)}">${escapeHTML(scrapedData.url)}</a> &nbsp;·&nbsp; ${scrapedData.count} items &nbsp;·&nbsp; ${timestamp}</div>
  <table>
    <thead><tr><th>#</th>${tableHeaders}</tr></thead>
    <tbody>${tableRows}</tbody>
  </table>
  <div class="footer">Generated by JumpingSpider</div>
</body>
</html>`;

        download(html, `report_${Date.now()}.html`, "text/html");
      }

      // ── Save as JSONL for ML ──
      function saveAsJSONL() {
        if (!scrapedData) return;

        const lines = scrapedData.data
          .map((item) => {
            const record = {
              ...item,
              _source: scrapedData.url,
              _scraped_at: new Date().toISOString(),
            };
            return JSON.stringify(record);
          })
          .join("\n");

        download(lines, `dataset_${Date.now()}.jsonl`, "application/jsonl");
      }

      function download(content, filename, type) {
        const blob = new Blob([content], { type });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        URL.revokeObjectURL(a.href);
      }
    </script>
  </body>
</html>
